<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NAS dashboard setup wizard">
    <title>{% block title %}NAS Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <div class="brand-icon">🗄️</div>
            <div>
                <p class="subtitle">NAS Dashboard</p>
                <h1 class="title">{% block header_title %}Setup Wizard{% endblock %}</h1>
            </div>
        </div>
        <div class="status-chip">Guided setup</div>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/style.js"></script>
</body>
</html>
